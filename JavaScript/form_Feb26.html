<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Event Registration</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <h1>Register yourself for a networking event</h1>

    <form id="eventForm">

        <div class="field">
            <label>Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
            <label>Phone Number</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}">
        </div>

        <div class="field">
            <label>LinkedIn Profile URL</label>
            <input type="url" id="linkedin" name="linkedin">
        </div>

        <div class="field">
            <label>Years of Experience</label>
            <input type="number" id="experience" name="experience" min="0" max="50">
        </div>

        <div class="field">
            <label>Date of Birth</label>
            <input type="date" id="dob" name="dob">
        </div>

        <div class="field">
            <label>Preferred Contact Time</label>
            <input type="time" id="contactTime" name="contactTime">
        </div>

        <div class="field">
            <label>Rate your communication skills (1-10)</label>
            <input type="range" id="skills" name="skills" min="1" max="10" value="5">
        </div>

        <div class="field">
            <label>Short Bio</label>
            <textarea id="bio" name="bio" rows="3"></textarea>
        </div>

        <div class="field">
            <label>Set up a password for future meetups (optional)</label>
            <input type="password" id="password" name="password">
        </div>

        <div class="field">
            <label>Select Event Classification</label>
            <select name="event" required>
                <option value="">--Select an event category--</option>
                <option value="Tech Startup Pitch">Tech Startup Pitch</option>
                <option value="Casual Industry Mixer">Casual Industry Mixer</option>
                <option value="Panel Discussion">Panel Discussion</option>
            </select>
        </div>

        <div class="group">
            <label class="group-title">Preferred Time</label>

            <div class="option">
                <input type="radio" name="time" value="Morning" required>
                <span>Morning</span>
            </div>

            <div class="option">
                <input type="radio" name="time" value="Afternoon">
                <span>Afternoon</span>
            </div>

            <div class="option">
                <input type="radio" name="time" value="Evening">
                <span>Evening</span>
            </div>
        </div>

        <div class="group">
            <label class="group-title">Topics of Interest</label>

            <div class="option">
                <input type="checkbox" name="topics" value="Software Engineering">
                <span>Software Engineering</span>
            </div>

            <div class="option">
                <input type="checkbox" name="topics" value="Product Management">
                <span>Product Management</span>
            </div>

            <div class="option">
                <input type="checkbox" name="topics" value="Marketing & Sales">
                <span>Marketing & Sales</span>
            </div>

            <div class="option">
                <input type="checkbox" name="topics" value="Design & UX">
                <span>Design & UX</span>
            </div>
        </div>

        <button type="submit">Submit Registration</button>

        <div id="output"></div>
    </form>
    <script src="form.js"></script>
</body>

</html>
