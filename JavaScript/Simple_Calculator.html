<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator!</title>
    <link rel="stylesheet" href="C.css">
</head>

<body>

    <main class="calc">
        <h1>Simple Calculator</h1>

        <div class="display">
            <div class="display-left">
                <input type="number" id="num1" placeholder="1st number">
                <input type="number" id="num2" placeholder="2nd number">
            </div>
            <div id="res" class="display-result"></div>
        </div>

        <div class="controls">
            <button id="add" onclick="add()">Add</button>
            <button id="subtract" onclick="subtract()">Subtract</button>
            <button id="multiply" onclick="multiply()">Multiply</button>
            <button id="divide" onclick="divide()">Divide</button>
        </div>
    </main>


    <script>
        function add() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var result = Number(num1) + Number(num2);
            document.getElementById("res").innerHTML = "Result is: "   + result;
        }

        function subtract() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var result = Number(num1) - Number(num2);
            document.getElementById("res").innerHTML = "Result is: " + result;
        }

        function multiply() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var result = Number(num1) * Number(num2);
            document.getElementById("res").innerHTML = "Result is: " + result;
        }

        function divide() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            if (Number(num2) === 0) {
                document.getElementById("res").innerHTML = "Error: Division by zero is not allowed.";
                return;
            }
            var result = Number(num1) / Number(num2);
            document.getElementById("res").innerHTML = "Result is: " + result;
        }

    </script>
</body>

</html>
